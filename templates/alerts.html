<!DOCTYPE html>
<html>
<head>
    <title>Task Scheduler | AgriScan</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f4; }
        .container { width: 50%; margin: auto; background: #fff; padding: 20px; border-radius: 10px; }
        input, button { padding: 10px; margin: 10px; width: 80%; font-size: 16px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: #28a745; color: #fff; }
        .done { color: gray; text-decoration: line-through; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📅 Schedule Your Farm Tasks</h2>
        <form method="POST">
            <input type="text" name="task" placeholder="Enter task (e.g., Water the crops)" required>
            <input type="datetime-local" name="alert_time" required>
            <input type="text" name="phone" placeholder="Phone number (Optional)">
            <button type="submit">➕ Add Task</button>
        </form>

        <h3>📋 Your Scheduled Tasks</h3>
        <table>
            <tr>
                <th>Task</th>
                <th>Time</th>
                <th>Status</th>
            </tr>
            {% if alerts_data %}
                {% for task, alert_time, status in alerts_data %}
                    <tr class="{{ 'done' if status == 'done' else '' }}">
                        <td>{{ task }}</td>
                        <td>{{ alert_time }}</td>
                        <td>{{ status }}</td>
                    </tr>
                {% endfor %}
            {% else %}
                <tr>
                    <td colspan="3">No tasks scheduled yet.</td>
                </tr>
            {% endif %}
        </table>
    </div>
</body>
</html>
